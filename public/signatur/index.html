<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gowtham Signature</title>
    <!-- Load Tailwind CSS from CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Global reset and box model */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Load the local Japanese font */
        @font-face {
            font-family: 'JapanDaisuki';
            src: url('./japan-daisuki-font/JapanDaisuki-8OeaZ.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        /* Small Loading Animation Styles */
        .small-loading-svg {
            width: 40px;
            height: 40px;
            margin-top: 2rem;
        }

        .small-loading-svg circle:first-child {
            stroke: #374151;
        }

        .small-loading-svg circle:last-child {
            stroke: #FA0143; /* Using your red color */
        }

        /* Define the Japanese font for the signature */
        .signature-font {
            font-family: 'JapanDaisuki', sans-serif;
            font-weight: normal;
            letter-spacing: 0.1em;
        }
        
        /* Style for the red G and white rest of text */
        .red-g {
            color: #FA0143; /* Red color for the G */
        }
        
        .white-text {
            color: white; /* White color for the rest */
        }

        /* Responsive font sizes */
        .responsive-text {
            font-size: 3rem; /* Mobile base size */
        }

        /* Small devices (landscape phones, 576px and up) */
        @media (min-width: 576px) {
            .responsive-text {
                font-size: 4rem;
            }
        }

        /* Medium devices (tablets, 768px and up) */
        @media (min-width: 768px) {
            .responsive-text {
                font-size: 6rem;
            }
        }

        /* Large devices (desktops, 992px and up) */
        @media (min-width: 992px) {
            .responsive-text {
                font-size: 8rem;
            }
        }

        /* Extra large devices (large desktops, 1200px and up) */
        @media (min-width: 1200px) {
            .responsive-text {
                font-size: 10rem;
            }
        }

        /* Ultra wide screens */
        @media (min-width: 1400px) {
            .responsive-text {
                font-size: 12rem;
            }
        }

        /* Responsive container */
        .responsive-container {
            padding: 1rem;
            max-width: 100%;
            width: 100%;
        }

        @media (min-width: 768px) {
            .responsive-container {
                padding: 2rem;
            }
        }

        @media (min-width: 1200px) {
            .responsive-container {
                padding: 3rem;
            }
        }

        /* --- Keyframe Animations --- */
        /* This animation simulates the text being drawn */
        @keyframes draw-text {
            to {
                width: 100%;
            }
        }

        /* Animation for the line drawing effect */
        @keyframes drawLine {
            from {
                transform: scaleX(0);
            }

            to {
                transform: scaleX(1);
            }
        }

        /* Fade in and slight pulse for the title */
        @keyframes fadeInPulse {
            0% {
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 1;
            }
        }

        /* --- Custom Classes with Animations --- */
        .animate-draw-line {
            animation: drawLine 1s ease-in-out forwards;
            transform-origin: left;
        }

        .animate-fade-in-pulse {
            animation: fadeInPulse 1.5s ease-in-out forwards;
        }

        /* Simple signature wrapper without animation */
        .signature-wrapper {
            position: relative;
        }

        /* Background using your local image - responsive */
        .geometric-bg {
            background-image: url('./Gemini_Generated_Image_3jr5e53jr5e53jr5.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
            overflow: hidden;
            min-height: 100vh;
            width: 100%;
        }

        /* Fix background attachment on mobile */
        @media (max-width: 768px) {
            .geometric-bg {
                background-attachment: scroll;
            }
        }

        /* Main Content Styles */
        #content {
            display: block;
            opacity: 1;
        }

        /* Optional overlay for better text readability */
        .geometric-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(1px);
        }
    </style>
</head>

<body class="geometric-bg text-white flex items-center justify-center min-h-screen">
    <!-- Main Content -->
    <main class="responsive-container text-center">
        <!-- Responsive Name (using Japanese font) -->
        <h1 class="signature-font responsive-text font-bold signature-wrapper">
            <span class="red-g">G</span><span class="white-text">owtham</span>
        </h1>
        
        <!-- Small Loading Animation Below Text -->
        <div class="flex justify-center">
            <svg class="small-loading-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
                <!-- Background circle (unchanging) -->
                <circle cx="80" cy="80" r="55" fill="none" stroke-width="40" />
                <!-- Animated foreground circle -->
                <g transform="translate(80, 80)">
                    <circle cx="0" cy="0" r="55" fill="none" stroke-width="35" stroke-dasharray="0, 345" stroke-linecap="round">
                        <!-- Rotation animation -->
                        <animateTransform attributeName="transform" type="rotate" from="0" to="360" begin="0s" dur="0.75s" repeatCount="indefinite" />
                        <!-- Dash/Gap animation (creates the "pulling" effect) -->
                        <animate attributeName="stroke-dasharray" values="0, 345; 172.5, 172.5; 0, 345" dur="1.5s" repeatCount="indefinite" />
                    </circle>
                </g>
            </svg>
        </div>
    </main>
</body>

</html>
